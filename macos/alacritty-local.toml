# macOS overrides, imported by .config/alacritty/alacritty.toml

[font]
size = 14.0   # 9 is unreadable on a Retina screen

[window]
option_as_alt = "OnlyLeft" # left Option = Meta like Linux Alt; right Option still types ü/é
decorations = "Buttonless"

# Linux font zoom keys; Alacritty's macOS defaults use ⌘, which Karabiner
# never sends from Ctrl inside terminals
[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Plus"
mods = "Control|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
