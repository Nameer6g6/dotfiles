# AeroSpace config mirroring xmonad.hs.
# Mod = Super: the Win key on the PC keyboard, ⌃ on the MacBook keyboard.
# Karabiner (macos/karabiner) sends Super as ctrl+alt+cmd ("hyper"), so
# cmd-alt-ctrl-X below means Super+X and never clashes with app shortcuts.
#
# Reload after editing: Super+q (like xmonad mod-q).
# Find an app's id for [[on-window-detected]]: `aerospace list-apps`

start-at-login = true

# Focused border like xmonad's myFocusedBorderColor / myNormalBorderColor
after-startup-command = [
  'exec-and-forget borders active_color=0xff89ddff inactive_color=0xffbfbfbf width=6.0',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Tall layout by default; accordion is the closest thing to xmonad's tabbed
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Same 8px gaps as xmonad's spacingRaw
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

[mode.main.binding]
# --- xmonad defaults ---
cmd-alt-ctrl-shift-enter = 'exec-and-forget open -na Alacritty'
cmd-alt-ctrl-shift-c     = 'close'
cmd-alt-ctrl-q           = 'reload-config'

cmd-alt-ctrl-j       = 'focus --boundaries-action wrap-around-the-workspace dfs-next'
cmd-alt-ctrl-k       = 'focus --boundaries-action wrap-around-the-workspace dfs-prev'
cmd-alt-ctrl-shift-j = 'swap dfs-next'
cmd-alt-ctrl-shift-k = 'swap dfs-prev'
cmd-alt-ctrl-h       = 'resize smart -50'
cmd-alt-ctrl-l       = 'resize smart +50'

cmd-alt-ctrl-space       = 'layout tiles horizontal vertical'   # Tall <-> Mirror Tall
cmd-alt-ctrl-shift-space = 'layout accordion tiles'             # tabbed
cmd-alt-ctrl-f           = 'fullscreen'                         # Full
cmd-alt-ctrl-t           = 'layout floating tiling'             # sink / float
cmd-alt-ctrl-m           = 'macos-native-minimize'

cmd-alt-ctrl-1 = 'workspace 1'
cmd-alt-ctrl-2 = 'workspace 2'
cmd-alt-ctrl-3 = 'workspace 3'
cmd-alt-ctrl-4 = 'workspace 4'
cmd-alt-ctrl-5 = 'workspace 5'
cmd-alt-ctrl-6 = 'workspace 6'
cmd-alt-ctrl-7 = 'workspace 7'
cmd-alt-ctrl-8 = 'workspace 8'
cmd-alt-ctrl-9 = 'workspace 9'

cmd-alt-ctrl-shift-1 = 'move-node-to-workspace 1'
cmd-alt-ctrl-shift-2 = 'move-node-to-workspace 2'
cmd-alt-ctrl-shift-3 = 'move-node-to-workspace 3'
cmd-alt-ctrl-shift-4 = 'move-node-to-workspace 4'
cmd-alt-ctrl-shift-5 = 'move-node-to-workspace 5'
cmd-alt-ctrl-shift-6 = 'move-node-to-workspace 6'
cmd-alt-ctrl-shift-7 = 'move-node-to-workspace 7'
cmd-alt-ctrl-shift-8 = 'move-node-to-workspace 8'
cmd-alt-ctrl-shift-9 = 'move-node-to-workspace 9'

cmd-alt-ctrl-tab       = 'workspace-back-and-forth'
cmd-alt-ctrl-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- myKeys ---
# Super+p (launcher) is handled by Karabiner: it opens Spotlight
cmd-alt-ctrl-shift-e = 'exec-and-forget open -a Finder'
cmd-alt-ctrl-shift-n = 'exec-and-forget open -a Obsidian'
cmd-alt-ctrl-shift-t = 'exec-and-forget open -a Telegram'
cmd-alt-ctrl-shift-w = 'exec-and-forget open -a "Google Chrome"'
cmd-alt-ctrl-shift-b = 'exec-and-forget open -a "Brave Browser"'
cmd-alt-ctrl-shift-d = 'exec-and-forget open -a Discord'
cmd-alt-ctrl-shift-s = 'exec-and-forget screencapture -ic'   # maim -s | copyq: region to clipboard

# Rarely-used actions behind a submap
cmd-alt-ctrl-shift-semicolon = 'mode service'

[mode.service.binding]
esc       = ['reload-config', 'mode main']
r         = ['flatten-workspace-tree', 'mode main']   # reset layout
f         = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# --- myManageHook: pin apps to workspaces ---
[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 5'

# Check with `aerospace list-apps` if Raindrop doesn't land on 6
[[on-window-detected]]
if.app-id = 'io.raindrop.macapp'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'net.ankiweb.dtop'
run = 'move-node-to-workspace 8'
